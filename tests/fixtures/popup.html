<!doctype html>
<title>Popup</title>
<h1>Sign in with Example</h1>
<button onclick="window.opener && window.opener.postMessage('signed in', '*'); window.close()">Approve</button>
<!-- closes on mouse-down: the click's mouse-up goes to a page that is already gone -->
<button onmousedown="window.opener && window.opener.postMessage('closed early', '*'); window.close()">Approve now</button>
