<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nested scroll panel</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/20px sans-serif;background:white;color:#17202a}header{height:100px;padding:24px 20px;background:#dfe8ef}h1{font-size:18px;margin:0}#panel{height:360px;margin:0 20px;overflow:auto;border:2px solid #34495e}.toolbar{position:sticky;top:0;height:60px;background:#d4e6f1;z-index:2;display:flex;align-items:center;padding:8px;gap:8px}.toolbar button{height:40px}table{width:100%;border-collapse:collapse}th{position:sticky;top:60px;height:30px;background:#34495e;color:white;z-index:1}td{height:50px;padding:0 10px;border-bottom:1px solid #bbb}footer{height:140px;padding:20px;background:#e8dccc}.note{padding:15px 20px;color:#555;font-size:13px}
</style></head><body><header><h1>Nested scroll table</h1></header><section id="panel" aria-label="Station readings"><nav class="toolbar"><button>Latest</button><button>Details</button></nav><table id="readings" aria-label="Hourly readings"><thead><tr><th>Station</th><th>Reading</th></tr></thead><tbody id="rows"></tbody></table></section><footer>Footer outside the scrolling panel</footer><p class="note">The table is clipped by its panel. Rows behind the sticky controls or outside the panel are not visible.</p><script>
const tbody=document.getElementById('rows');for(let i=0;i<40;i++){const row=document.createElement('tr');row.dataset.index=i;row.innerHTML='<td>Station '+String(i).padStart(2,'0')+'</td><td>'+i+' m/s</td>';tbody.appendChild(row)}document.getElementById('panel').scrollTop=430;
</script></body></html>
