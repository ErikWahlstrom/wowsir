[package]
name = "wowsir"
version = "0.2.0"
edition = "2021"
description = "A fast, headless, agent-first browser CLI for testing websites"
license = "MIT"
repository = "https://github.com/ErikWahlstrom/wowsir"
readme = "README.md"
keywords = ["browser", "testing", "cdp", "mcp", "agents"]
categories = ["development-tools::testing", "command-line-utilities", "web-programming"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/plugin/skills/wowsir/SKILL.md"]

# `cargo binstall wowsir` downloads the GitHub release binary instead of compiling
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "wowsir"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
similar = "2"
shell-words = "1"
base64 = "0.22"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
