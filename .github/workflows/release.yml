name: release
# After every merge to main, release-please keeps one "chore(main): release X.Y.Z" PR
# up to date (version in Cargo.toml, Cargo.lock and plugin.json, plus CHANGELOG.md),
# deciding patch/minor from the conventional PR titles (fix: / feat:). Merging that
# PR creates the tag and GitHub release; the jobs below then build, upload the
# binaries and publish to crates.io. The release PR's CI waits for a maintainer
# to click "Approve workflows to run" (GitHub's rule for bot-opened PRs).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # crates.io versions are permanent: refuse a release whose files disagree
  check:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG but Cargo.toml says $v"; exit 1; }
          p=$(jq -r .version plugin/.claude-plugin/plugin.json)
          [ "$p" = "$v" ] || { echo "plugin.json says $p but Cargo.toml says $v"; exit 1; }

  build:
    needs: [release-please, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu } # older glibc = runs on more distros
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="wowsir-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          cp "target/${{ matrix.target }}/release/wowsir$exe" README.md LICENSE "$name/"
          mkdir "$name/skills" && cp -r plugin/skills/wowsir "$name/skills/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            wowsir-*.tar.gz
            wowsir-*.zip

  # release-please already created the GitHub release (with the changelog): add the binaries
  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # Trusted Publishing: crates.io trusts this workflow in the crates-io environment,
  # so no long-lived token is stored anywhere
  publish:
    needs: [release-please, upload]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
