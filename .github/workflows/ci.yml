name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GitHub's runners come with Google Chrome; wowsir finds it on its own
      - name: Build and run tests/*.wowsir
        run: ./tests/smoke.sh
        env:
          WOWSIR_NO_SANDBOX: "1"
