name: ci
# PRs only: main is protected, so every change on it already passed these checks
# in its PR. (macOS runners are scarce; running everything again after each merge
# doubled the wait.) Releases build again from the tag.
on:
  pull_request:
  workflow_dispatch:

# a newer push to the same PR replaces its queued/running checks
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GitHub's runners come with Google Chrome; wowsir finds it on its own
      - name: Build and run tests/*.wowsir
        shell: bash   # Git Bash on Windows
        run: ./tests/smoke.sh
        env:
          WOWSIR_NO_SANDBOX: "1"
